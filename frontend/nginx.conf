server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

  types { application/wasm wasm; }

  # Hashed build output: cache for a year
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Self-hosted MediaPipe runtime (large, versioned by package): cache for a week
  location /mediapipe/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # Never cache the HTML shell so new deploys are picked up immediately
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
