<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SignBridge is an ASL recognition research prototype that helps turn recognized signs into editable language and speech." />
    <title>SignBridge — Make every gesture understood</title>
    <script>
    /* apply the saved theme before first paint (no flash). "system" = no attribute */
    try { var t = localStorage.getItem('sb-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
