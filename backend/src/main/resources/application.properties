spring.application.name=backend

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/signbridge}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Gemini AI API
gemini.api.key=${GEMINI_API_KEY:your_api_key_here}
gemini.model=gemini-2.5-flash

# Google Cloud TTS
tts.api.key=${TTS_API_KEY:your_google_cloud_api_key_here}
tts.url=https://texttospeech.googleapis.com/v1/text:synthesize

logging.level.org.springdoc=INFO
logging.level.org.springframework.web=INFO


