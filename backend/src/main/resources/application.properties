spring.application.name=backend

# Cloud Run injects PORT; local default is 8080
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/signbridge}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
# Fail fast (instead of the 30s default) if PostgreSQL is unreachable
spring.datasource.hikari.connection-timeout=5000

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Python FastAPI ML service (MediaPipe + TFLite inference)
fastapi.base-url=${FASTAPI_BASE_URL:http://localhost:8001}
fastapi.connect-timeout=${FASTAPI_CONNECT_TIMEOUT:5s}
# Generous enough for a Cloud Run cold start of the ML service
fastapi.read-timeout=${FASTAPI_READ_TIMEOUT:30s}

# Gemini AI API (leave unset to use the local fallback)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Google Cloud TTS (leave unset to let the browser speak instead)
tts.api.key=${TTS_API_KEY:}
tts.url=https://texttospeech.googleapis.com/v1/text:synthesize

# OpenAPI UI at /docs (same path the FastAPI service used)
springdoc.swagger-ui.path=/docs

logging.level.org.springdoc=INFO
logging.level.org.springframework.web=INFO

# CORS (comma separated; keep in sync with the FastAPI service)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://signbridge-frontend-389644353290.us-central1.run.app}
